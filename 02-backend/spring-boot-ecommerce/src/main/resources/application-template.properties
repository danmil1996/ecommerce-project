spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/full-stack-ecommerce?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=ecommerceapp
spring.datasource.password=ecommerceapp

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.data.rest.base-path=/api

allowed.origins=https://localhost:4200

## issuer url must ends with "/"
okta.oauth2.issuer=YOUR_AUTH0_ISSUER_URL
okta.oauth2.client-id=YOUR_AUTH0_CLIENT_ID
okta.oauth2.audience=https://localhost:8443


spring.data.rest.detection-strategy=ANNOTATED
###########################################################################
# HTTPS

# Server web port
server.port=8443

# Enable HTTPS support (only accept HTTPS requests)
server.ssl.enabled=true

# Alias that identifies the key in the key store
server.ssl.key-alias=dm

# Keystore location
server.ssl.key-store=classpath:dm-keystore.p12

# Keystore password
server.ssl.key-store-password=secret

# Keystore format
server.ssl.key-store-type=PKCS12

###########################################################################
# DEBUG
# logging.level.org.springframework.security=TRACE
# logging.level.org.springframework.web=DEBUG
###########################################################################

###########################################################################
# Payment Processing with Stripe
stripe.key.secret=YOUR_STRIPE_SECRET_KEY
###########################################################################

