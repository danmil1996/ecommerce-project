<div class="main-content page-m">
    <div class="section-content section-content-p30">
        <div class="container-fluid">

            <form [formGroup]="chkFormGroup" (ngSubmit)="onSubmit()">
                <div formGroupName="customer" class="form-area">
                    <h3>Customer</h3>
                    <!--First Name-->
                    <div class="row">
                        <div class="col-md-2"><label>First Name</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <input type="text" formControlName="firstName"/>
                                <!--Validations-->
                                <app-shop-validator [formControl]="firstName" [fieldName]="'First Name'">
                                </app-shop-validator>
                            </div>
                        </div>
                    </div>
                    <!--Last Name-->
                    <div class="row">
                        <div class="col-md-2"><label>Last Name</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <input type="text" formControlName="lastName"/>
                                <!--Validations-->
                                <app-shop-validator [formControl]="lastName" [fieldName]="'Last Name'">
                                </app-shop-validator>
                            </div>
                        </div>
                    </div>
                    <!--Email-->
                    <div class="row">
                        <div class="col-md-2"><label>Email</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <input type="text" formControlName="email"/>
                                <!--Validations-->
                                <app-shop-validator [formControl]="email" [fieldName]="'Email'">
                                </app-shop-validator>
                            </div>
                        </div>
                    </div>
                </div>

                <div formGroupName="shippingAddress" class="form-area">
                    <h3>Shipping Address</h3>
                     <!--Country-->
                     <div class="row">
                        <div class="col-md-2"><label>Country</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <select formControlName="country" (ngModelChange)="onChangeShippingAddCountry($event)">
                                    <option *ngFor="let country of countryList" [ngValue]="country">{{country.name}}</option>
                                </select>
                                <!--Validations-->
                                <app-shop-validator [formControl]="shpAddCountry" [fieldName]="'Country'">
                                </app-shop-validator>
                            </div>
                        </div>
                    </div>
                    <!--Street-->
                    <div class="row">
                        <div class="col-md-2"><label>Street</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <input type="text" formControlName="street"/>
                                 <!--Validations-->
                                 <app-shop-validator [formControl]="shpAddStreet" [fieldName]="'Street'">
                                </app-shop-validator>
                            </div>
                        </div>
                    </div>
                    <!--City-->
                    <div class="row">
                        <div class="col-md-2"><label>City</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <input type="text" formControlName="city"/>
                                 <!--Validations-->
                                 <app-shop-validator [formControl]="shpAddCity" [fieldName]="'City'">
                                </app-shop-validator>
                            </div>
                        </div>
                    </div>
                    <!--State-->
                    <div class="row">
                        <div class="col-md-2"><label>State</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <select formControlName="state">
                                    <option *ngFor="let state of shippingAddStateList" [ngValue]="state">
                                     {{state.name}}
                                    </option>
                                </select>
                                <!--Validations-->
                                <app-shop-validator [formControl]="shpAddState" [fieldName]="'State'">
                                </app-shop-validator>
                            </div>
                        </div>
                    </div>
                    <!--Zip Code-->
                    <div class="row">
                        <div class="col-md-2"><label>Zip Code</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <input type="text" formControlName="zipCode"/>
                                 <!--Validations-->
                                 <app-shop-validator [formControl]="shpAddZipCode" [fieldName]="'Zip Code'">
                                </app-shop-validator>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Copy Shipping to Billing Address -->
                <div class="input-space">
                    <label class="au-checkbox">
                        <input type="checkbox" (change)="copyShippingToBillingAddress($event)"/>
                        <span class="au-checkmark"></span> Billig Address same as Shipping Address
                    </label>
                </div>
            
                <div formGroupName="billingAddress" class="form-area">
                    <h3>Billing Address</h3>
                     <!--Country-->
                     <div class="row">
                        <div class="col-md-2"><label>Country</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <select formControlName="country" (ngModelChange)="onChangeBillingAddCountry($event)" >
                                    <option *ngFor="let country of countryList" [ngValue]="country">{{country.name}}</option>
                                </select>
                                <!--Validations-->
                                <app-shop-validator [formControl]="billAddCountry" [fieldName]="'Country'">
                                </app-shop-validator>
                            </div>
                        </div>
                    </div>
                    <!--Street-->
                    <div class="row">
                        <div class="col-md-2"><label>Street</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <input type="text" formControlName="street"/>
                                 <!--Validations-->
                                 <app-shop-validator [formControl]="billAddStreet" [fieldName]="'Street'">
                                </app-shop-validator>
                            </div>
                        </div>
                    </div>
                    <!--City-->
                    <div class="row">
                        <div class="col-md-2"><label>City</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <input type="text" formControlName="city"/>
                                 <!--Validations-->
                                 <app-shop-validator [formControl]="billAddCity" [fieldName]="'City'">
                                </app-shop-validator>
                            </div>
                        </div>
                    </div>
                    <!--State-->
                    <div class="row">
                        <div class="col-md-2"><label>State</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <select formControlName="state">
                                    <option *ngFor="let state of billingAddStateList" [ngValue]="state">
                                        {{state.name}}
                                    </option>
                                </select>
                                <!--Validations-->
                                <app-shop-validator [formControl]="billAddState" [fieldName]="'State'">
                                </app-shop-validator>
                            </div>
                        </div>
                    </div>
                    <!--Zip Code-->
                    <div class="row">
                        <div class="col-md-2"><label>Zip Code</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <input type="text" formControlName="zipCode"/>
                                 <!--Validations-->
                                 <app-shop-validator [formControl]="billAddZipCode" [fieldName]="'Zip Code'">
                                </app-shop-validator>
                            </div>
                        </div>
                    </div>
                </div>

                  <!-- Stripe Elements Credit Card Section -->
                  <div formGroupName="creditCard" class="form-area">

                    <h3>Credit or Debit Card</h3>

                    <div id="card-element">
                        <!-- a Stripe element will be inserted here -->
                    </div>

                    <!-- Used to display form errors -->
                    <div id="card-errors" class="displayError.textContent!=='': 'alert alert-danger mt-1'"></div>

                </div>

                <!--Order Details-->
                <div class="form-area">
                    <h3>Review your order</h3>
                    <p>Total Quantity: {{ totalQuantity }}</p>
                    <p>Shipping: FREE</p>
                    <p>Total Price: {{ totalPrice | currency:'USD' }}</p>

                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-info" [disabled]="isPaymentButDisabled">Purchase</button>
                </div>
            
            </form>
        </div>
    </div>
</div>
